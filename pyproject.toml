[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firehistory-api"
version = "0.1.0"
description = "API REST del calendario armonizado de focos de calor MODIS x VIIRS para Argentina"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1,<2",
    "pyarrow>=17",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "shapely>=2.0,<3",
    "orjson>=3.10",
]

[project.optional-dependencies]
# Solo para desarrollo, pruebas y scripts de datos. No entran en la imagen.
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "numpy>=2",
]

# El código de la app se copia aparte en la imagen (COPY app); el paquete
# instalado solo aporta las dependencias.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes y signos

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*"]
ignore_missing_imports = true
