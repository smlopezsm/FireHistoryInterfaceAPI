name: CI y publicación

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGEN: ghcr.io/smlopezsm/firehistory-api

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tipos
        run: mypy app
      - name: Pruebas
        run: pytest -q

  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
            type=semver,pattern=v{{version}}
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: firehistory-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tamaño de la imagen (código < 250 MB; total < 400 MB con los datos)
        run: |
          total=$(docker image inspect firehistory-api:ci --format '{{.Size}}')
          datos=$(docker run --rm --entrypoint du firehistory-api:ci -sb /var/data/current | cut -f1)
          codigo=$((total - datos))
          echo "Total: $((total / 1024 / 1024)) MB · datos: $((datos / 1024 / 1024)) MB · código: $((codigo / 1024 / 1024)) MB"
          test "$codigo" -lt $((250 * 1024 * 1024))
          test "$total" -lt $((400 * 1024 * 1024))
      - name: Prueba de humo con los datos de la imagen
        run: |
          esperado=$(python3 -c "import json; print(json.load(open('data/current/metadata.json'))['data_version'])")
          docker run --rm -d -p 8001:8000 --name fh-datos \
            -e CORS_ORIGINS=http://localhost:5173 -e RELOAD_TOKEN=ci firehistory-api:ci
          for i in $(seq 1 60); do
            curl -fs localhost:8001/api/v1/health | grep -q '"estado":"ok"' && break
            sleep 1
          done
          curl -fs localhost:8001/api/v1/health | tee /dev/stderr | grep -q "\"data_version\":\"$esperado\""
          curl -fs -o /dev/null -w "calendario país: %{time_total}s\n" \
            "localhost:8001/api/v1/calendario?bbox=-74,-56,-53,-21"
          docker stop fh-datos
      - name: Prueba de humo con los fixtures
        run: |
          docker run --rm -d -p 8000:8000 --name fh-api \
            -v "$PWD/tests/fixtures:/var/data/current:ro" \
            -e CORS_ORIGINS=http://localhost:5173 -e RELOAD_TOKEN=ci firehistory-api:ci
          test "$(docker exec fh-api id -u)" = "10001"
          for i in $(seq 1 30); do
            curl -fs localhost:8000/api/v1/health && break
            sleep 1
          done
          curl -fs localhost:8000/api/v1/health | grep -q '"estado":"ok"'
          docker stop fh-api
      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Desplegar en Dokploy
        if: github.ref == 'refs/heads/main'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL no configurado; se omite el despliegue."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
